[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openspg-py"
version = "0.1.0"
description = "Python SDK migration of OpenSPG Java HTTP client (schema/concept facades)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
  { name = "OpenSPG Python Migration" }
]
dependencies = [
  "requests>=2.31.0",
  "cachetools>=5.3.3"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

